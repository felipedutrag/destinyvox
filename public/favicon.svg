<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="dv-bg-glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e1405" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#0a0907" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#040404" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Central Aura -->
    <radialGradient id="dv-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Gradients for Facets -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fffbeb"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="gold-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Base container: Squircle with gold rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#dv-bg-glow)" stroke="url(#gold-border)" stroke-width="1.2"/>

  <!-- Subtle sacred geometry outer orbit -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#d97706" stroke-opacity="0.3" stroke-dasharray="2 3" stroke-width="0.8"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#f59e0b" stroke-opacity="0.15" stroke-width="0.5"/>

  <!-- Ambient Glow -->
  <circle cx="32" cy="32" r="16" fill="url(#dv-aura)"/>

  <!-- Secondary Diagonal Rays (8-point Hermetic Star) -->
  <g>
    <!-- NE Ray -->
    <polygon points="32,32 45,19 32,26" fill="url(#gold-mid)"/>
    <polygon points="32,32 45,19 38,32" fill="url(#gold-dark)"/>
    <!-- SE Ray -->
    <polygon points="32,32 45,45 38,32" fill="url(#gold-mid)"/>
    <polygon points="32,32 45,45 32,38" fill="url(#gold-dark)"/>
    <!-- SW Ray -->
    <polygon points="32,32 19,45 32,38" fill="url(#gold-mid)"/>
    <polygon points="32,32 19,45 26,32" fill="url(#gold-dark)"/>
    <!-- NW Ray -->
    <polygon points="32,32 19,19 26,32" fill="url(#gold-mid)"/>
    <polygon points="32,32 19,19 32,26" fill="url(#gold-dark)"/>
  </g>

  <!-- Cardinal Primary Rays (Facet 3D Shading) -->
  <g>
    <!-- North Ray -->
    <polygon points="32,32 27,27 32,7" fill="url(#gold-light)"/>
    <polygon points="32,32 37,27 32,7" fill="url(#gold-dark)"/>
    <!-- East Ray -->
    <polygon points="32,32 37,27 57,32" fill="url(#gold-light)"/>
    <polygon points="32,32 37,37 57,32" fill="url(#gold-dark)"/>
    <!-- South Ray -->
    <polygon points="32,32 37,37 32,57" fill="url(#gold-mid)"/>
    <polygon points="32,32 27,37 32,57" fill="url(#gold-light)"/>
    <!-- West Ray -->
    <polygon points="32,32 27,37 7,32" fill="url(#gold-dark)"/>
    <polygon points="32,32 27,27 7,32" fill="url(#gold-light)"/>
  </g>

  <!-- Central Core Diamond & Spark -->
  <polygon points="32,26 38,32 32,38 26,32" fill="#fffbeb" stroke="#f59e0b" stroke-width="0.6"/>
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
  
  <!-- Four Cardinal Celestial Dots -->
  <circle cx="32" cy="4" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="60" cy="32" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="32" cy="60" r="1" fill="#fef08a" opacity="0.9"/>
  <circle cx="4" cy="32" r="1" fill="#fef08a" opacity="0.9"/>
</svg>